<div class="card" [class.done]="Task.done" (click)="onCardClick()">
  <div class="card-header">
    <h3 class="title">{{ Task.title }}</h3>
    <span class="priority-badge" [class]="Task.priority.toLowerCase()">{{ Task.priority }}</span>
  </div>

  <p class="description">{{ Task.desc }}</p>

  <div class="meta-row">
    <span class="meta-item category-badge">{{ Task.category }}</span>
    <span class="meta-item date-badge">{{ Task.dueDate }}</span>
  </div>

  @if (Task.tags) {
    <div class="tags">
      @for (tag of Task.tags.split(','); track $index) {
        <span class="tag">{{ tag.trim() }}</span>
      }
    </div>
  }

  <div class="card-footer" (click)="onCheckboxClick($event)">
    <label class="done-toggle">
      <input type="checkbox" [(ngModel)]="Task.done" (ngModelChange)="onCheckboxChange()" />
      <span class="checkmark"></span>
      <span class="toggle-label">{{ Task.done ? 'Completed' : 'Mark done' }}</span>
    </label>
  </div>
</div>
